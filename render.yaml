# =============================================================================
# Render Blueprint — SvapNora (free tier)
#
# One free Web Service runs the API and serves the built React client from the
# same origin. The database is external (Supabase free PostgreSQL) and supplied
# through the DATABASE_URL secret.
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# After the first deploy, copy the service URL into APP_ORIGIN / API_ORIGIN /
# CORS_ORIGINS below (or in the dashboard) and redeploy.
#
# Free-tier notes that shape this file:
#   * Outbound SMTP (ports 25/465/587) is blocked, so email uses the Brevo HTTP
#     API over HTTPS instead of SMTP (EMAIL_PROVIDER=brevo).
#   * There is no shell access or one-off jobs, so the administrator is created
#     automatically during start (safe to run on every deploy).
# =============================================================================

services:
  - type: web
    name: svapnora
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run admin:create && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"

      # Replace with the URL Render assigns (e.g. https://svapnora.onrender.com),
      # or your custom domain once it is connected.
      - key: APP_ORIGIN
        value: https://svapnora.onrender.com
      - key: API_ORIGIN
        value: https://svapnora.onrender.com
      - key: CORS_ORIGINS
        value: https://svapnora.onrender.com

      # Used by the client build for canonical / social meta tags. Change this
      # to the custom domain once it is connected, then redeploy.
      - key: VITE_SITE_URL
        value: https://svapnora.onrender.com

      # Render generates a strong random value automatically.
      - key: SESSION_SECRET
        generateValue: true

      # Supabase connection string — set in the dashboard (kept secret).
      # Use the "Session pooler" URI (port 5432) for a long-running server:
      # it works for both Prisma migrations and runtime queries.
      - key: DATABASE_URL
        sync: false

      # Used by `npm run admin:create` (runs automatically on each deploy and
      # only creates the administrator if it does not already exist).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ROLE
        value: OWNER

      # Email via the Brevo HTTP API (works despite blocked SMTP ports).
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false

      - key: PAYMENT_PROVIDER
        value: none
      - key: PAYMENTS_DEMO_MODE
        value: "true"
